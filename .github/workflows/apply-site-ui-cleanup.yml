name: Apply site UI cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'site-ui-cleanup-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: site-ui-cleanup-final
          fetch-depth: 1

      - name: Apply mobile Releases and loader cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('docs/guide-html/index.html')
          text = index.read_text(encoding='utf-8')

          releases = '    <a class="btn alt" href="https://github.com/Raymon-Research-Team/ZenOS-RTOS/releases">Releases</a>'
          mobile_css = '    .top .nav .btn.alt{display:none!important}'
          if mobile_css not in text:
              marker = '  .site-home-link{color:#334155!important;white-space:nowrap}'
              if marker in text:
                  text = text.replace(marker, mobile_css + '@media(max-width:850px){.top .nav .btn.alt{display:none!important}}\n' + marker, 1)
              else:
                  text = text.replace('</style>', '@media(max-width:850px){.top .nav .btn.alt{display:none!important}}\n</style>', 1)
          index.write_text(text, encoding='utf-8')

          guide = Path('docs/guide-html/guide.html')
          text = guide.read_text(encoding='utf-8')

          loader_block = re.compile(r'\n<!-- Loading Animation -->\n<div id="loader".*?</div>\n<style>\n@keyframes pulse.*?</style>\n', re.S)
          text, removed = loader_block.subn('\n', text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected exactly one loader block, removed={removed}')

          text = re.sub(
              r'\n// Hide loader when page loads\n',
              '\n',
              text,
              count=1,
          )
          text = re.sub(
              r'\n    // Hide loader\n    setTimeout\(function\(\) \{\n        var loader = document\.getElementById\(\'loader\'\);\n        loader\.style\.opacity = \'0\';\n        setTimeout\(function\(\) \{ loader\.style\.display = \'none\'; \}, 500\);\n    \}, 1000\);',
              '',
              text,
              count=1,
          )
          guide.write_text(text, encoding='utf-8')

      - name: Verify exact site-only changes
        run: |
          test -f docs/guide-html/index.html
          test -f docs/guide-html/guide.html
          ! grep -q 'id="loader"' docs/guide-html/guide.html
          ! grep -q 'Loading ZenOS Guide' docs/guide-html/guide.html
          grep -q '@media(max-width:850px){.top .nav .btn.alt{display:none!important}}' docs/guide-html/index.html
          git diff --check
          git diff -- docs/guide-html/index.html docs/guide-html/guide.html

      - name: Commit site-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide-html/index.html docs/guide-html/guide.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix mobile Releases button and remove Guide loader"
          git push origin site-ui-cleanup-final

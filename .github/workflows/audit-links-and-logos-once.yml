name: Audit and fix documentation links and logos

on:
  push:
    paths:
      - '.github/workflows/audit-links-and-logos-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix moved logo paths and public Guide URL
        run: |
          python3 <<'PY'
          from pathlib import Path

          SITE = 'https://raymon-research-team.github.io/ZenOS-RTOS/'

          # Markdown documentation lives in docs/, while site assets now live in docs/guide-html/.
          for p in Path('docs').glob('*.md'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('src="./ZenOS_logo.svg"', 'src="guide-html/ZenOS_logo.svg"')
              p.write_text(s, encoding='utf-8')

          # The public Guide link should always use the canonical GitHub Pages site URL.
          for name in ['README.md', 'docs/README_FA.md']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('docs/guide-html/index.html', SITE)
              s = s.replace('guide-html/index.html', SITE)
              p.write_text(s, encoding='utf-8')

          # Remove accidental references to the temporary Cloudflare Worker URL if any appear later.
          for p in [Path('README.md'), Path('docs/README_FA.md'), *Path('docs').glob('*.md')]:
              s = p.read_text(encoding='utf-8')
              s = s.replace('https://zenos-rtos.rahman-h22.workers.dev/', SITE)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate local site assets and links
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('docs/guide-html')
          html_files = list(root.glob('*.html'))
          assert (root / 'index.html').is_file(), 'Missing site index.html'
          assert (root / 'ZenOS_logo.svg').is_file(), 'Missing ZenOS_logo.svg'
          assert (root / 'ZenOS_logo_site.svg').is_file(), 'Missing ZenOS_logo_site.svg'
          assert (root / 'donate-qr.png').is_file(), 'Missing donate-qr.png'

          for p in html_files:
              text = p.read_text(encoding='utf-8')
              for attr, target in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', text):
                  if target.startswith(('http://', 'https://', 'mailto:', '#', 'data:', 'javascript:')):
                      continue
                  clean = target.split('#', 1)[0].split('?', 1)[0]
                  if not clean:
                      continue
                  if not (p.parent / clean).resolve().is_file():
                      raise SystemExit(f'Missing local asset/link: {p} -> {target}')

          print(f'Validated {len(html_files)} HTML pages and all referenced local assets.')
          PY

      - name: Commit fixes and remove one-time workflow
        run: |
          rm -f .github/workflows/audit-links-and-logos-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows/audit-links-and-logos-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Audit documentation links and logo paths"
          git push

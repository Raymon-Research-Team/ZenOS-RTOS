name: Normalize Guide UI temp

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'guide-ui-normalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: guide-ui-normalize
          fetch-depth: 1

      - name: Normalize Guide cover controls
        shell: python
        run: |
          from pathlib import Path
          import re
          guide = Path('docs/guide-html/guide.html')
          text = guide.read_text(encoding='utf-8')
          text = text.replace('.cover img { width: 320px; border-radius: 16px; margin-bottom: 20px; }', '.cover > img { width: 320px; height: auto; border-radius: 16px; margin-bottom: 18px; }\n.cover .readme-badges { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; margin:2px 0 14px; line-height:0; }\n.cover .readme-badges a { display:inline-flex; align-items:center; margin:0; padding:0; line-height:0; }\n.cover .readme-badges img { width:auto !important; height:20px !important; max-width:none !important; border-radius:0 !important; margin:0 !important; display:block; }\n.cover > p[style*="margin-top:20px"] { margin-top:14px !important; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }\n.cover > p[style*="margin-top:20px"] a { display:inline-flex !important; align-items:center; justify-content:center; min-height:34px; padding:7px 14px !important; font-size:0.82rem !important; line-height:1.2 !important; font-weight:600; border-radius:7px !important; margin:0 !important; }')
          old = re.compile(r'<div class="readme-badges".*?</div>', re.S)
          new = '''<div class="readme-badges" aria-label="ZenOS project badges">
            <img src="https://img.shields.io/badge/MIT%20License-2ea44f?style=flat" alt="MIT License" height="20">
            <img src="https://img.shields.io/badge/Version-1.0.0-43a047?style=flat" alt="Version 1.0.0" height="20">
            <img src="https://img.shields.io/badge/ARM%20Cortex--M-ef6c00?style=flat" alt="ARM Cortex-M" height="20">
            <img src="https://img.shields.io/badge/C%2B%2B11-6a1b9a?style=flat" alt="C++11" height="20">
            <img src="https://img.shields.io/badge/IEC%2062304-c62828?style=flat" alt="IEC 62304" height="20">
            <img src="https://img.shields.io/badge/IEC%2061508-ad1457?style=flat" alt="IEC 61508" height="20">
          </div>'''
          text, count = old.subn(new, text, count=1)
          if count != 1: raise SystemExit(f'badge block replacement count={count}')
          guide.write_text(text, encoding='utf-8')

      - name: Verify and commit
        run: |
          grep -q '.cover > img' docs/guide-html/guide.html
          grep -q '.cover .readme-badges img' docs/guide-html/guide.html
          grep -q 'style=flat' docs/guide-html/guide.html
          ! grep -q 'style=for-the-badge' docs/guide-html/guide.html
          git diff --check
          git add docs/guide-html/guide.html
          git rm .github/workflows/normalize-guide-ui-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Guide cover badges and controls"
          git push origin guide-ui-normalize

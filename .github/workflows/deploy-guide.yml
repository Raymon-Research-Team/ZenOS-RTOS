name: Deploy Guide to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Copy docs to site directory
        run: |
          mkdir -p _site
          cp docs/guide.html _site/guide.html
          cp docs/donate-qr.png _site/ 2>/dev/null || true
          cp ZenOS_logo.svg _site/ 2>/dev/null || true
          cp docs/index.html _site/index.html 2>/dev/null || true
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

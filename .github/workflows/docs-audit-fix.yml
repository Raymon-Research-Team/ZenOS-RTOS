name: Docs audit fix

on:
  push:
    paths:
      - '.github/workflows/docs-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix documentation consistency
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('docs')
          changed = []

          def replace(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              old = s
              for a, b in replacements:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          # Source layout is ZenOS/<file>, not ZenOS/ZenOS/<file>.
          for name in ['API_TUTORIAL.md', 'API_TUTORIAL_FA.md']:
              replace(root / name, [
                  ('from `ZenOS/ZenOS/`', 'from `ZenOS/`'),
                  ('from **`ZenOS/ZenOS/`**', 'from **`ZenOS/`**'),
                  ('Source (ZenOS/ZenOS/)', 'Source (ZenOS/)'),
                  ('`ZenOS/ZenOS/', '`ZenOS/'),
              ])

          # Do not claim that optional safety mechanisms are enabled by default.
          safety_repls = [
              ('All mechanisms are enabled by default and can be individually toggled.',
               'ZenOS provides configurable safety mechanisms. Only features enabled in `ZenOS_Config.hpp` are compiled and active.'),
              ('All mechanisms are enabled by default.',
               'ZenOS provides configurable safety mechanisms; the active set is controlled by `ZenOS_Config.hpp`.'),
              ('همه مکانیسم‌ها به‌صورت پیش‌فرض فعال هستند و می‌توانند به‌صورت جداگانه غیرفعال شوند.',
               'ZenOS مجموعه‌ای از مکانیزم‌های ایمنی قابل تنظیم ارائه می‌کند؛ فعال بودن هر قابلیت توسط `ZenOS_Config.hpp` تعیین می‌شود.'),
              ('همه مکانیسم‌ها به‌صورت پیش‌فرض فعال هستند.',
               'مکانیزم‌های ایمنی ZenOS قابل تنظیم هستند و فعال بودن هر قابلیت توسط `ZenOS_Config.hpp` تعیین می‌شود.'),
          ]
          for name in ['SAFETY_MANUAL.md', 'SAFETY_MANUAL_FA.md', 'README_FA.md', 'API_TUTORIAL.md', 'API_TUTORIAL_FA.md']:
              replace(root / name, safety_repls)

          # Correct claims that imply MPU/memory protection is always active.
          protection_repls = [
              ('ZenOS handles the hard parts (scheduling, interrupts, memory protection). You just write tasks.',
               'ZenOS handles the hard parts (scheduling, interrupts, and configurable safety mechanisms). Hardware memory protection is target-dependent and optional.'),
              ('ZenOS handles scheduling, interrupts, and memory protection.',
               'ZenOS handles scheduling and interrupts, with optional target-dependent memory protection.'),
              ('ZenOS handles scheduling, interrupts, memory protection, and safety.',
               'ZenOS handles scheduling and interrupts, with configurable safety features and optional target-dependent memory protection.'),
          ]
          for name in ['API_TUTORIAL.md', 'API_TUTORIAL_FA.md', 'SAFETY_MANUAL.md', 'SAFETY_MANUAL_FA.md', 'README_FA.md']:
              replace(root / name, protection_repls)

          # Remove the stale local CONTRIBUTING_FA link if present; the repository does not contain that file.
          for name in ['README_FA.md']:
              p = root / name
              s = p.read_text(encoding='utf-8')
              old = s
              s = s.replace('[CONTRIBUTING_FA.md](CONTRIBUTING_FA.md)', '[Contributing](../CONTRIBUTING.md)')
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  if str(p) not in changed: changed.append(str(p))

          # Make performance comparisons explicitly benchmark-dependent rather than universal claims.
          p = root / 'ZENOS_ADVANTAGES.md'
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('ZenOS outperforms the competition', 'ZenOS is designed for deterministic, low-overhead real-time operation')
          s = re.sub(r'(?m)(\|\s*ZenOS\s*\|\s*~?1\.2\s*µs\s*\|)', r'| ZenOS | ~1.2 µs* |', s)
          if '*Benchmark values are representative measurements and depend on MCU, compiler, optimization, configuration, and test methodology.' not in s:
              marker = '## '
              idx = s.find(marker)
              note = '\n> **Benchmark note:** Timing figures are representative measurements only. Actual results depend on MCU, compiler, optimization level, configuration, clock rate, and measurement methodology. They should not be treated as universal comparisons without a reproducible benchmark.\n\n'
              if idx >= 0:
                  s = s[:idx] + note + s[idx:]
              else:
                  s += note
          if s != old:
              p.write_text(s, encoding='utf-8')
              if str(p) not in changed: changed.append(str(p))

          # Keep the documentation sitemap focused on actual public HTML pages.
          # No Markdown files are added because GitHub Pages does not expose them as independent HTML routes here.

          print('Changed:', changed)
          if not changed:
              raise SystemExit('No documentation changes detected; refusing to create an empty docs commit.')

      - name: Commit documentation fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/docs-audit-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .github/workflows/docs-audit-fix.yml
          git commit -m 'Fix documentation consistency and safety claims'
          git push origin HEAD:main

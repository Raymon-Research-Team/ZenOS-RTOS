name: Remove Guide Modern Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-guide-modern-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Modern theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/guide.html')
          s = p.read_text(encoding='utf-8')

          # Remove the Modern theme CSS block.
          s = re.sub(r'\n/\* Modern site theme \*/.*?\n\s*</style>', '\n    </style>', s, count=1, flags=re.S)

          # Remove the theme toggle button, leaving language controls intact.
          s = re.sub(r'\n\s*<button class="theme-btn" id="theme-toggle".*?</button>', '', s, count=1, flags=re.S)

          # Remove the Modern-theme toggle script.
          s = re.sub(r'\n\s*<script>\s*\(function\(\)\{\s*var saved = localStorage\.getItem\(\'zenos-guide-theme\'\);.*?</script>', '', s, count=1, flags=re.S)

          # Remove the loading-screen Modern override added previously.
          s = re.sub(r'\n\s*/\* ZenOS modern loading screen theme \*/.*?(?=\n\s*</style>)', '', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*<script>\s*/\* ZenOS loading message contrast fallback \*/.*?</script>', '', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove Guide Modern theme'
          git push

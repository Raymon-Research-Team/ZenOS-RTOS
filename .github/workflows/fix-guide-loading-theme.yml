name: Fix Guide action buttons

on:
  push:
    paths:
      - '.github/workflows/fix-guide-loading-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Guide action button styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/guide.html')
          s = p.read_text(encoding='utf-8')
          css = '''
        /* Guide action buttons */
        .guide-actions { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; margin-top:20px; }
        .guide-actions a { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:700; line-height:1.2; box-sizing:border-box; transition:transform .2s ease, box-shadow .2s ease, background .2s ease; }
        .guide-actions a:hover { transform:translateY(-1px); box-shadow:0 5px 14px rgba(0,0,0,.15); }
        .guide-actions .github-btn { background:#24292e; color:#fff !important; }
        .guide-actions .github-btn:hover { background:#1b1f23; }
        .guide-actions .home-btn { background:linear-gradient(135deg,#0277bd,#00838f); color:#fff !important; }
        .guide-actions .home-btn:hover { background:linear-gradient(135deg,#01579b,#006064); }
        @media (max-width:600px) {
            .guide-actions { gap:8px; }
            .guide-actions a { width:100%; max-width:320px; }
        }
'''
          marker = '/* Guide action buttons */'
          if marker not in s:
              s = s.replace('</style>', css + '\n    </style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Guide action button layout'
          git push
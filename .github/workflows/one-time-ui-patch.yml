name: One-time UI patch

on:
  push:
    paths:
      - '.github/workflows/one-time-ui-patch.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch HTML UI
        shell: python
        run: |
          from pathlib import Path

          guide = Path('docs/guide.html')
          text = guide.read_text(encoding='utf-8')

          if 'id="theme-toggle"' not in text:
              theme_css = r'''

          /* Modern site theme */
          body.modern-theme { --primary:#52d8ff; --primary-light:#2188ff; --secondary:#9b6cff; --accent:#52d8ff; --warning:#ffb454; --bg:#07111f; --sidebar-bg:#0d1c2e; --sidebar-text:#9bb0c5; --sidebar-active:#52d8ff; --card-bg:#0d1c2e; --text:#eef8ff; --text-secondary:#9bb0c5; --border:rgba(151,190,220,.16); --code-bg:#07111f; --code-text:#7bdcff; background-color:var(--bg); background-image:none; color:var(--text); }
          body.modern-theme .sidebar { background:linear-gradient(180deg,#0d1c2e 0%,#07111f 100%); }
          body.modern-theme .sidebar-header { background:#f8f9f6; border-color:#dfe5df; }
          body.modern-theme .sidebar-header h3 { color:#334155; }
          body.modern-theme .sidebar-header p { color:#64748b; }
          body.modern-theme .main-content { background:radial-gradient(circle at 85% 0%,rgba(33,136,255,.12),transparent 32%),radial-gradient(circle at 10% 25%,rgba(155,108,255,.08),transparent 30%),#07111f; }
          body.modern-theme .cover, body.modern-theme .card, body.modern-theme .donate-section { background:linear-gradient(145deg,rgba(16,36,58,.96),rgba(13,28,46,.96)); color:#eef8ff; border-color:rgba(151,190,220,.16); }
          body.modern-theme .cover h1, body.modern-theme .card h1, body.modern-theme .card h2, body.modern-theme .card h3 { color:#eef8ff; }
          body.modern-theme .cover p, body.modern-theme .card p, body.modern-theme li, body.modern-theme td { color:#c4d4e3; }
          body.modern-theme a { color:#52d8ff; }
          body.modern-theme table { background:#0d1c2e; color:#eef8ff; }
          body.modern-theme th { background:#10243a; color:#eef8ff; }
          body.modern-theme tr:nth-child(even) { background:rgba(255,255,255,.025); }
          body.modern-theme pre { background:#07111f !important; border-color:rgba(151,190,220,.16); }
          body.modern-theme code:not(pre code) { background:rgba(82,216,255,.08); color:#7bdcff; }
          body.modern-theme .lang-btn { background:#f8f9f6; color:#334155; }
          body.modern-theme .lang-btn.active { background:#2188ff; color:#fff; }
          body.modern-theme .theme-btn { background:linear-gradient(135deg,#2188ff,#9b6cff); color:#fff; }
          .theme-btn { padding:8px 14px; border:0; border-radius:20px; cursor:pointer; font-size:.82em; font-weight:700; background:#24292e; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.15); }
          .guide-actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:20px; }
          .guide-actions a { display:inline-flex !important; align-items:center; justify-content:center; padding:10px 20px !important; border-radius:8px; text-decoration:none; font-weight:700; }
          .guide-actions .github-btn { background:#24292e; color:#fff !important; }
          .guide-actions .home-btn { background:linear-gradient(135deg,#2188ff,#9b6cff); color:#fff !important; }
          body.modern-theme .guide-actions .github-btn { background:#182331; border:1px solid rgba(151,190,220,.16); }
          @media (max-width:900px) { .theme-btn { padding:8px 11px; } .guide-actions a { width:auto; } }
          '''
              text = text.replace('</style>', theme_css + '\n</style>', 1)

              old_buttons = '<p style="margin-top:20px;"><a href="https://github.com/Raymon-Research-Team/ZenOS-RTOS" target="_blank" style="display:inline-block;padding:10px 24px;background:#24292e;color:white;border-radius:8px;text-decoration:none;font-weight:600;">🔗 View on GitHub</a></p>'
              new_buttons = '''<div class="guide-actions">
          <a class="github-btn" href="https://github.com/Raymon-Research-Team/ZenOS-RTOS" target="_blank" rel="noopener">🔗 View on GitHub</a>
          <a class="home-btn" href="index.html">← Back to ZenOS Home</a>
          </div>'''
              if old_buttons not in text:
                  raise SystemExit('Guide GitHub button marker not found; refusing to modify guide.html')
              text = text.replace(old_buttons, new_buttons, 1)

              toggle_marker = '<button class="lang-btn" id="btn-fa" onclick="setLang(\'fa\')">🇮🇷 فارسی</button>'
              toggle_replacement = toggle_marker + '\n    <button class="theme-btn" id="theme-toggle" type="button" onclick="toggleTheme()">🌙 Modern</button>'
              if toggle_marker not in text:
                  raise SystemExit('Guide language toggle marker not found')
              text = text.replace(toggle_marker, toggle_replacement, 1)

              script = r'''
          <script>
          (function(){
              var saved = localStorage.getItem('zenos-guide-theme');
              if (saved === 'modern') document.body.classList.add('modern-theme');
              function updateThemeButton(){
                  var b=document.getElementById('theme-toggle');
                  if(b) b.textContent=document.body.classList.contains('modern-theme')?'☀️ Classic':'🌙 Modern';
              }
              window.toggleTheme=function(){
                  document.body.classList.toggle('modern-theme');
                  localStorage.setItem('zenos-guide-theme', document.body.classList.contains('modern-theme')?'modern':'classic');
                  updateThemeButton();
              };
              document.addEventListener('DOMContentLoaded', updateThemeButton);
          })();
          </script>
          '''
              text = text.replace('</body>', script + '\n</body>', 1)
              guide.write_text(text, encoding='utf-8')

          index = Path('docs/index.html')
          text = index.read_text(encoding='utf-8')
          marker = '.donate-btn{'
          release_css = '.top .btn.alt{background:linear-gradient(135deg,#2188ff,#9b6cff);color:#fff!important;border:0;box-shadow:0 8px 22px rgba(33,136,255,.22)}'
          if '.top .btn.alt{' not in text:
              if marker not in text:
                  raise SystemExit('Index donate CSS marker not found; refusing to modify index.html')
              text = text.replace(marker, release_css + marker, 1)
          index.write_text(text, encoding='utf-8')

      - name: Commit UI changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/guide.html .github/workflows/one-time-ui-patch.yml
          git rm .github/workflows/one-time-ui-patch.yml
          git commit -m "Improve guide navigation and add theme switcher" || exit 0
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

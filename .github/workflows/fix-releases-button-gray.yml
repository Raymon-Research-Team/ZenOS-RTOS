name: Restyle Releases Button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-releases-button-gray.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restyle Releases button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.top .btn.alt{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#28272e,#160527);color:#fff!important;font-family:system-ui,sans-serif;font-size:14px;font-weight:700;border-radius:10px;text-decoration:none;box-shadow:0 0 20px rgba(108,92,231,0.4)}'
          new = '.top .btn.alt{display:inline-block;padding:12px 28px;background:#6b7280;color:#fff!important;font-family:system-ui,sans-serif;font-size:14px;font-weight:700;border-radius:10px;text-decoration:none;box-shadow:0 0 16px rgba(107,114,128,.28)}.top .btn.alt:hover{background:#7b8491;color:#fff!important;filter:none;transform:translateY(-1px);transition:.2s}'
          if old not in s:
              raise SystemExit('Expected Releases button style not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-releases-button-gray.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html .github/workflows/fix-releases-button-gray.yml
          git commit -m 'Restyle Releases button to gray'
          git push
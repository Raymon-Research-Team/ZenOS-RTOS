name: Restore Guide Home Link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-guide-home-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Home button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/guide.html')
          s = p.read_text(encoding='utf-8')
          marker = '<a href="https://github.com/Raymon-Research-Team/ZenOS-RTOS" target="_blank">🔗 View on GitHub</a>'
          home = ' <a href="index.html">← Back to ZenOS Home</a>'
          if marker not in s:
              raise SystemExit('Guide GitHub action button not found')
          if 'Back to ZenOS Home' not in s:
              s = s.replace(marker, marker + home, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-guide-home-link.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.html .github/workflows/fix-guide-home-link.yml
          git commit -m 'Restore Guide Home button'
          git push

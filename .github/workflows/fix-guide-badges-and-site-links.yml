name: Fix guide badges and site links

on:
  push:
    paths:
      - '.github/workflows/fix-guide-badges-and-site-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize guide badges and public site links
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          SITE = 'https://raymon-research-team.github.io/ZenOS-RTOS/'

          guide = Path('docs/guide-html/guide.html')
          s = guide.read_text(encoding='utf-8')

          badges = '''<div class="badges" aria-label="ZenOS project features">
              <img src="https://img.shields.io/badge/MIT%20License-2ea44f?style=flat" alt="MIT License" height="22">
              <img src="https://img.shields.io/badge/Safety%20Mechanisms-0277bd?style=flat" alt="Safety Mechanisms" height="22">
              <img src="https://img.shields.io/badge/IEC%20Target%20Profiles-8e44ad?style=flat" alt="IEC Target Profiles" height="22">
              <img src="https://img.shields.io/badge/Priority%20Bitmap%20Scheduler-f39c12?style=flat" alt="Priority Bitmap Scheduler" height="22">
              <img src="https://img.shields.io/badge/100%C2%B5s%20Tick-00838f?style=flat" alt="100μs Tick" height="22">
              <img src="https://img.shields.io/badge/Zero%20Heap-546e7a?style=flat" alt="Zero Heap" height="22">
          </div>'''

          pattern = re.compile(r'<div class="badges"[^>]*>.*?</div>', re.DOTALL)
          if not pattern.search(s):
              raise SystemExit('Guide badge container not found')
          s = pattern.sub(badges, s, count=1)
          guide.write_text(s, encoding='utf-8')

          # Guide links in READMEs must point to the public GitHub Pages site, not the repository HTML file.
          for name in ['README.md', 'docs/README_FA.md']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  'https://github.com/Raymon-Research-Team/ZenOS-RTOS/blob/main/docs/guide-html/index.html',
                  SITE,
              )
              text = text.replace('docs/guide-html/index.html', SITE)
              text = text.replace('guide-html/index.html', SITE)
              text = text.replace('https://zenos-rtos.rahman-h22.workers.dev/', SITE)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-guide-badges-and-site-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README_FA.md docs/guide-html/guide.html .github/workflows/fix-guide-badges-and-site-links.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize guide badges and public site links"
          git push

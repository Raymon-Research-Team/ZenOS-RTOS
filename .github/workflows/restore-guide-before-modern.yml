name: Restore Guide before Modern Theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-guide-before-modern.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Guide from pre-Modern commit
        run: |
          git checkout b326d5c79ef3c7f6473738eab3295bdf134e8c0b -- docs/guide.html
          rm -f .github/workflows/restore-guide-before-modern.yml

      - name: Commit restored Guide and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.html .github/workflows/restore-guide-before-modern.yml
          git commit -m 'Restore Guide to pre-Modern theme state'
          git push

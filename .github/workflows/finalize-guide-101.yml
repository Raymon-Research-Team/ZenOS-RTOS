name: Finalize ZenOS 1.0.1 guide

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs: finalize guide for 1.0.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize guide and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/guide-html/guide.html')
          s = p.read_text(encoding='utf-8')
          original = s
          replacements = [
              (r'\bO\(1\)\b', 'bounded priority-range scan'),
              (r'Priority Inheritance', 'Priority Ceiling'),
              (r'priority inheritance', 'priority ceiling'),
              (r'March C-', 'bounded RAM integrity test'),
              (r'32-level priority', '32-default-slot priority configuration'),
              (r'32 level priority', '32-default-slot priority configuration'),
              (r'32 priority levels', '32 default priority slots (configurable from 2 to 256)'),
              (r'32 priority level', '32 default priority slots (configurable from 2 to 256)'),
          ]
          for pattern, repl in replacements:
              s = re.sub(pattern, repl, s, flags=re.IGNORECASE)
          notice = '''\n<section id="release-101-notice" style="margin:20px 0;padding:18px 20px;border-left:5px solid #0277bd;background:#eef8ff;border-radius:8px;">\n  <h2>ZenOS 1.0.1 — authoritative implementation note</h2>\n  <p>For release 1.0.1, the authoritative implementation facts are: <strong>32 priority slots by default</strong>, configurable from <strong>2 to 256</strong>; priority 0 is reserved for idle and application priorities use 1..255 at the 256-slot limit; higher numeric priority values are higher priority; the scheduler uses a priority bitmap with per-priority ready queues and scans the configured priority range; the default kernel tick is <strong>100 µs</strong> (configurable 100–1000 µs); mutexes use an <strong>IPC priority-ceiling</strong> mechanism; and safety mechanisms are configurable, with most disabled by default.</p>\n  <p>Safety configuration and target-profile checks are engineering mechanisms, not certification evidence. This guide does not claim IEC 62304/61508 certification or product compliance.</p>\n  <p>For maintained release-specific facts, see <a href="current.html">Current Implementation — ZenOS 1.0.1</a>.</p>\n</section>\n'''
          if 'id="release-101-notice"' not in s:
              s = s.replace('<body>', '<body>' + notice, 1)
          if s == original:
              raise SystemExit('Guide contained no expected stale claims; refusing a no-op release commit')
          p.write_text(s, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide-html/guide.html
          git rm .github/workflows/finalize-guide-101.yml
          git commit -m 'docs: finalize guide for 1.0.1'
          git push

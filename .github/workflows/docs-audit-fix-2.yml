name: Docs audit fix 2

on:
  push:
    paths:
      - '.github/workflows/docs-audit-fix-2.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix remaining documentation claims and links
        shell: python
        run: |
          from pathlib import Path
          import re

          docs = Path('docs')
          changed = []

          # Remove the stale contribution link because there is no CONTRIBUTING.md in this repository.
          p = docs / 'README_FA.md'
          s = p.read_text(encoding='utf-8')
          old = s
          s = re.sub(r'^\| 🤝 \[Contributing\]\(\.\./CONTRIBUTING\.md\) \| نحوه مشارکت \|\s*\n', '', s, flags=re.M)
          if s != old:
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          # Safety documentation must reflect that optional mechanisms are configurable, not universally enabled.
          for p in [docs/'SAFETY_MANUAL.md', docs/'SAFETY_MANUAL_FA.md', docs/'README_FA.md', docs/'API_TUTORIAL.md', docs/'API_TUTORIAL_FA.md']:
              s = p.read_text(encoding='utf-8')
              old = s
              # English variants, including wording around the same claim.
              s = re.sub(r'(?i)all\s+(?:of\s+)?(?:the\s+)?(?:safety\s+)?mechanisms\s+(?:are|is)\s+enabled\s+by\s+default(?:\s+and\s+can\s+be\s+individually\s+(?:toggled|disabled))?\.?',
                          'ZenOS provides configurable safety mechanisms; only features enabled in `ZenOS_Config.hpp` are active.', s)
              s = re.sub(r'(?i)all\s+safety\s+features\s+are\s+enabled\s+by\s+default\.?',
                          'ZenOS safety features are configurable; the active set is controlled by `ZenOS_Config.hpp`.', s)
              # Persian variants.
              s = re.sub(r'همه(?:ٔ|‌| )?(?:مکانیزم|قابلیت)‌?های?\s+(?:ایمنی\s+)?به‌صورت\s+پیش‌فرض\s+فعال\s+هستند(?:\s+و\s+می‌توانند\s+به‌صورت\s+جداگانه\s+(?:غیرفعال|تنظیم)\s+شوند)?\.?',
                          'مکانیزم‌های ایمنی ZenOS قابل تنظیم هستند؛ فعال بودن هر قابلیت توسط `ZenOS_Config.hpp` تعیین می‌شود.', s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  if str(p) not in changed: changed.append(str(p))

          print('Changed:', changed)
          if not changed:
              raise SystemExit('No remaining documentation changes detected.')

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/docs-audit-fix-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .github/workflows/docs-audit-fix-2.yml
          git commit -m 'Finish documentation audit fixes'
          git push origin HEAD:main

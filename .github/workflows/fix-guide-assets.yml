name: Fix Guide Asset Paths

on:
  push:
    paths:
      - '.github/workflows/fix-guide-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix moved guide asset paths
        run: |
          python3 <<'PY'
          from pathlib import Path
          replacements = {
              'docs/ZenOS_logo.svg': 'docs/guide-html/ZenOS_logo.svg',
              'docs/donate-qr.png': 'docs/guide-html/donate-qr.png',
          }
          for name in ['README.md', 'docs/README_FA.md']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if name == 'docs/README_FA.md':
                  s = s.replace('./ZenOS_logo.svg', 'guide-html/ZenOS_logo.svg')
                  s = s.replace('./donate-qr.png', 'guide-html/donate-qr.png')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-guide-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README_FA.md .github/workflows/fix-guide-assets.yml
          git diff --cached --quiet || git commit -m "Fix README paths for moved guide assets"
          git push

name: SEO homepage update
on:
  push:
    paths:
      - 'docs/seo-trigger.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve homepage SEO
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<meta name="description" content="ZenOS-RTOS documentation portal — ARM Cortex-M real-time operating system written in C++11.">', '<meta name="description" content="ZenOS RTOS is a compact C++11 real-time operating system for ARM Cortex-M and STM32 microcontrollers. Explore scheduling, tasks, IPC, timing, monitoring, safety mechanisms, API documentation and source code.">')
          s = s.replace('<title>ZenOS RTOS — Documentation</title>', '<title>ZenOS RTOS — ARM Cortex-M Real-Time Operating System | STM32</title>')
          s = s.replace('<meta property="og:title" content="ZenOS RTOS — Documentation">', '<meta property="og:title" content="ZenOS RTOS — ARM Cortex-M Real-Time Operating System">')
          s = s.replace('<meta property="og:description" content="ZenOS-RTOS documentation portal — ARM Cortex-M real-time operating system written in C++11.">', '<meta property="og:description" content="Compact C++11 RTOS for ARM Cortex-M and STM32: priority-based scheduling, static task resources, IPC, timing, diagnostics and configurable safety mechanisms.">')
          s = s.replace('<meta name="twitter:title" content="ZenOS RTOS — Documentation">', '<meta name="twitter:title" content="ZenOS RTOS — ARM Cortex-M Real-Time Operating System">')
          s = s.replace('<meta name="twitter:description" content="ZenOS-RTOS documentation portal — ARM Cortex-M real-time operating system written in C++11.">', '<meta name="twitter:description" content="Compact C++11 RTOS for ARM Cortex-M and STM32 microcontrollers, with scheduling, tasks, IPC, timing and diagnostics.">')
          marker = '<meta name="twitter:image" content="https://raymon-research-team.github.io/ZenOS-RTOS/ZenOS_logo_site.svg">'
          ld = '''\n  <script type="application/ld+json">\n  {"@context":"https://schema.org","@type":"WebSite","name":"ZenOS RTOS","url":"https://raymon-research-team.github.io/ZenOS-RTOS/","description":"Compact C++11 real-time operating system for ARM Cortex-M and STM32 microcontrollers.","publisher":{"@type":"Organization","name":"Raymon Research Team","url":"https://github.com/Raymon-Research-Team"}}\n  </script>\n  <script type="application/ld+json">\n  {"@context":"https://schema.org","@type":"SoftwareSourceCode","name":"ZenOS RTOS","codeRepository":"https://github.com/Raymon-Research-Team/ZenOS-RTOS","programmingLanguage":["C++11","C"],"runtimePlatform":"ARM Cortex-M","license":"https://opensource.org/licenses/MIT"}\n  </script>'''
          if '"@type":"WebSite"' not in s:
              s = s.replace(marker, marker + ld)
          anchor = '<section class="wrap quickstart">'
          seo_section = '''<section class="wrap" style="padding-top:0"><div class="banner"><h2 style="margin-top:0">ZenOS RTOS for ARM Cortex-M and STM32</h2><p>ZenOS is a compact embedded real-time operating system for ARM Cortex-M microcontrollers, including STM32 projects. The kernel provides priority-based scheduling, task management, timing, events, mutexes, queues, semaphores, runtime monitoring and configurable safety mechanisms. Developers can use the documentation to learn how to build firmware with ZenOS, understand its scheduler and IPC model, configure the kernel, and troubleshoot embedded applications.</p><p style="margin-bottom:0"><a class="link" href="about.html">Learn more about ZenOS →</a> · <a class="link" href="faq.html">Read the FAQ →</a></p></div></section>\n  '''
          if 'ZenOS RTOS for ARM Cortex-M and STM32' not in s:
              s = s.replace(anchor, seo_section + anchor)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Improve homepage SEO metadata and structured data" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/seo-homepage-update.yml docs/seo-trigger.txt
          git add .github/workflows/seo-homepage-update.yml docs/seo-trigger.txt
          git commit -m "Remove temporary SEO workflow" || exit 0
          git push

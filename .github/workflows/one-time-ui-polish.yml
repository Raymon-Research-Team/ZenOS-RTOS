name: One-time UI polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-ui-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # About: make the main heading compact enough to stay on one line on desktop.
          p = Path('docs/about.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('h1{font-size:clamp(2.6rem,6vw,5.2rem);', 'h1{font-size:clamp(2rem,4vw,3.4rem);')
          p.write_text(s, encoding='utf-8')

          # Index: keep Releases clearly visible on the light header.
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.top .btn.alt{background:linear-gradient(135deg,#2188ff,#9b6cff);color:#fff!important;border:0;box-shadow:0 8px 22px rgba(33,136,255,.22)}'
          new = '.top .btn.alt{background:linear-gradient(135deg,#2188ff,#9b6cff)!important;color:#fff!important;border:0!important;box-shadow:0 8px 22px rgba(33,136,255,.22)}'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Guide modern theme: restore readable contrast for callouts and unify logo header tint.
          p = Path('docs/guide.html')
          s = p.read_text(encoding='utf-8')
          old = 'body.modern-theme .sidebar-header { background:#f8f9f6; border-color:#dfe5df; }'
          new = 'body.modern-theme .sidebar-header { background:rgba(238,243,247,.96); border-color:#d7e0e8; }'
          s = s.replace(old, new)
          marker = 'body.modern-theme .sidebar-header p { color:#64748b; }'
          additions = '''\nbody.modern-theme .note, body.modern-theme .warning, body.modern-theme .tip { color:#eef8ff; }\nbody.modern-theme .note { background:rgba(82,216,255,.10); border-color:#52d8ff; }\nbody.modern-theme .warning { background:rgba(255,180,84,.14); border-color:#ffb454; }\nbody.modern-theme .tip { background:rgba(0,131,143,.16); border-color:#52d8ff; }\nbody.modern-theme .note strong, body.modern-theme .warning strong, body.modern-theme .tip strong { color:#ffffff; }\nbody.modern-theme .note code, body.modern-theme .warning code, body.modern-theme .tip code { background:rgba(7,17,31,.72); color:#7bdcff; }\n'''
          if additions.strip() not in s:
              s = s.replace(marker, marker + additions)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/about.html docs/index.html docs/guide.html
          git commit -m 'Polish site typography and theme contrast'
          git push

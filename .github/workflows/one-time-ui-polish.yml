name: One-time UI polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-ui-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish HTML UI
        shell: python
        run: |
          from pathlib import Path

          docs = Path('docs')

          # Standardize visible navigation and header behavior on the compact site pages.
          for name in ['about.html', 'faq.html', 'stm32-rtos.html', 'index.html']:
              p = docs / name
              s = p.read_text(encoding='utf-8')

              if 'class="site-home-link"' not in s:
                  s = s.replace('</a><a class="hide"', '</a><a class="site-home-link" href="index.html">Home</a><a class="hide"', 1)
                  s = s.replace('</a><a href="https://github.com/Raymon-Research-Team/ZenOS-RTOS">GitHub</a>', '</a><a class="site-home-link" href="index.html">Home</a><a href="https://github.com/Raymon-Research-Team/ZenOS-RTOS">GitHub</a>', 1)

              nav_css = '.site-home-link{color:#334155!important;font-weight:800!important;white-space:nowrap}.top nav>a{white-space:nowrap;flex-shrink:0}.brand{flex-shrink:1;min-width:0}.brand img{flex-shrink:0}'
              if '.site-home-link{' not in s:
                  s = s.replace('</style>', nav_css + '</style>', 1)

              if name == 'index.html':
                  release_css = '.top .nav .btn.alt{display:inline-flex!important;visibility:visible!important;opacity:1!important;flex:0 0 auto;min-width:92px;white-space:nowrap;text-align:center}.top .nav .donate-btn{flex:0 0 auto;white-space:nowrap}'
                  s = s.replace('</style>', release_css + '</style>', 1)

              p.write_text(s, encoding='utf-8')

          # About: reduce the main title and keep it visually balanced on desktop.
          p = docs / 'about.html'
          s = p.read_text(encoding='utf-8')
          s = s.replace('h1{font-size:clamp(2rem,4vw,3.4rem);', 'h1{font-size:clamp(1.85rem,3.2vw,2.75rem);')
          s = s.replace('line-height:1.02;letter-spacing:-.05em;margin:12px 0 20px}', 'line-height:1.08;letter-spacing:-.04em;margin:12px 0 20px;max-width:100%;text-wrap:balance}')
          s = s.replace('@media(max-width:800px){.grid,.diagram{grid-template-columns:1fr 1fr}}', '@media(max-width:800px){.grid,.diagram{grid-template-columns:1fr 1fr}}')
          s = s.replace('@media(max-width:560px){.grid,.diagram{grid-template-columns:1fr}nav a.hide{display:none}}', '@media(max-width:560px){.grid,.diagram{grid-template-columns:1fr}nav a.hide,nav a.site-home-link{display:none}}')
          p.write_text(s, encoding='utf-8')

          # Guide modern theme: preserve the yellow warning accent, but use a dark navy
          # surface so text and inline code remain clearly readable.
          p = docs / 'guide.html'
          s = p.read_text(encoding='utf-8')
          modern_warning = 'body.modern-theme .warning{background:rgba(255,180,84,.10)!important;border-color:#ffb454!important;color:#eef8ff!important;box-shadow:inset 0 0 0 1px rgba(255,180,84,.05)}body.modern-theme .warning span,body.modern-theme .warning strong{color:#eef8ff!important}body.modern-theme .warning code{background:rgba(255,180,84,.14)!important;color:#ffd38a!important;border:1px solid rgba(255,180,84,.16)}'
          if 'body.modern-theme .warning{' not in s:
              s = s.replace('</style>', modern_warning + '</style>', 1)
          p.write_text(s, encoding='utf-8')

          # Keep the logo/header card intentionally light and softly blue-grey across all HTML pages.
          for p in docs.glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('background:#f8f9f6;', 'background:#eef3f7;')
              s = s.replace('background:rgba(248,249,246,.96)', 'background:rgba(238,243,247,.96)')
              p.write_text(s, encoding='utf-8')

      - name: Commit polished pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/*.html
          if git diff --cached --quiet; then
            echo 'No UI changes needed.'
          else
            git commit -m 'Polish site navigation, contrast, and typography'
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-ui-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-ui-polish.yml
          if git diff --cached --quiet; then
            echo 'Workflow already absent.'
          else
            git commit -m 'Remove one-time UI polish workflow'
            git push
          fi
